<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JimothyPet feature graphic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: #0c1410;
    }
    .banner {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 78% 28%, rgba(255, 220, 120, 0.18), transparent 55%),
        radial-gradient(ellipse 90% 70% at 20% 80%, rgba(40, 70, 40, 0.45), transparent 60%),
        linear-gradient(180deg, #0a120e 0%, #142018 42%, #1a2a1c 72%, #0e1812 100%);
    }
    .moon {
      position: absolute;
      top: 48px;
      right: 70px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff4c8, #e8c86a 55%, #c9a045 100%);
      box-shadow: 0 0 40px 16px rgba(255, 220, 120, 0.22);
    }
    .spark {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #f0d878;
      box-shadow: 0 0 8px 2px rgba(240, 216, 120, 0.7);
      opacity: 0.85;
    }
    .trees {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 18% 55% at 6% 78%, #06100a 70%, transparent 71%),
        radial-gradient(ellipse 14% 48% at 14% 82%, #08140c 70%, transparent 71%),
        radial-gradient(ellipse 16% 52% at 88% 80%, #06100a 70%, transparent 71%),
        radial-gradient(ellipse 12% 42% at 96% 84%, #08140c 70%, transparent 71%);
      opacity: 0.95;
      pointer-events: none;
    }
    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 118px;
      background:
        linear-gradient(180deg, transparent 0%, #152418 28%, #0c1610 100%);
    }
    .fence {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 72px;
      height: 54px;
      opacity: 0.55;
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0 18px,
        #0a120e 18px 26px
      );
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 35%, #000 100%);
    }
    .bushes {
      position: absolute;
      left: -20px;
      right: -20px;
      bottom: 0;
      height: 90px;
      background:
        radial-gradient(ellipse 140px 70px at 8% 100%, #0a160e 60%, transparent 61%),
        radial-gradient(ellipse 180px 80px at 28% 110%, #0c1810 58%, transparent 59%),
        radial-gradient(ellipse 160px 75px at 72% 105%, #0a160e 58%, transparent 59%),
        radial-gradient(ellipse 200px 90px at 92% 110%, #0c1810 55%, transparent 56%);
    }
    .copy {
      position: absolute;
      left: 56px;
      top: 148px;
      z-index: 3;
      max-width: 420px;
      color: #f0e2c4;
      font-family: "Nunito", "Trebuchet MS", "Avenir Next", sans-serif;
    }
    .copy h1 {
      font-size: 78px;
      line-height: 0.95;
      letter-spacing: -0.02em;
      font-weight: 800;
      color: #e8d4a8;
      text-shadow: 0 3px 0 rgba(20, 30, 18, 0.55);
    }
    .copy p {
      margin-top: 18px;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 600;
      color: rgba(236, 232, 214, 0.92);
      max-width: 380px;
    }
    .pet {
      position: absolute;
      right: 36px;
      bottom: 18px;
      width: 460px;
      height: 460px;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45));
    }
    .pet svg {
      width: 440px;
      height: 440px;
      overflow: visible;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="banner" id="banner">
    <div class="moon"></div>
    <div class="spark" style="left:120px;top:90px"></div>
    <div class="spark" style="left:210px;top:160px;width:4px;height:4px"></div>
    <div class="spark" style="left:340px;top:70px;width:3px;height:3px"></div>
    <div class="spark" style="left:480px;top:130px"></div>
    <div class="spark" style="left:560px;top:55px;width:4px;height:4px"></div>
    <div class="spark" style="left:700px;top:180px;width:3px;height:3px"></div>
    <div class="spark" style="left:860px;top:220px"></div>
    <div class="trees"></div>
    <div class="ground"></div>
    <div class="fence"></div>
    <div class="bushes"></div>
    <div class="copy">
      <h1>JimothyPet</h1>
      <p>Raise a real-time cryptid companion</p>
    </div>
    <div class="pet" id="pet"></div>
  </div>
  <script src="../js/raccoon.js"></script>
  <script>
    document.getElementById("pet").innerHTML = RaccoonArt.render({
      stage: "adult",
      adultForm: "saint",
      smiling: true,
      genes: { gray: 0.55, fluff: 0.5, mask: 0.6 },
    });
  </script>
</body>
</html>
